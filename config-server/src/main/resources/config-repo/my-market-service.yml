spring:
  application:
    name: my-market-service

  r2dbc:
    url: r2dbc:h2:mem:///my-market-service;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE
    username:
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:database/schema.sql
      data-locations: classpath:database/data.sql

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_LOGIN_CLIENT_ID:my-market-service}
            client-secret: ${KEYCLOAK_LOGIN_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email

        provider:
          keycloak:
            authorization-uri: ${BANK_KEYCLOAK_AUTHORIZATION_URI:http://localhost:8180/realms/my-bank-realm/protocol/openid-connect/auth}
            token-uri: ${BANK_KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/my-bank-realm/protocol/openid-connect/token}
            jwk-set-uri: ${BANK_KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/my-bank-realm/protocol/openid-connect/certs}
            user-info-uri: ${BANK_KEYCLOAK_USER_INFO_URI:http://localhost:8180/realms/my-bank-realm/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username

app:
  items-cache:
    ttl: 2m

api:
  gateway:
    base-url: ${API_GATEWAY_URL:http://localhost:8080}

  security:
    keycloak:
      logout-uri: ${BANK_KEYCLOAK_END_SESSION_URI:http://localhost:8180/realms/my-bank-realm/protocol/openid-connect/logout}

eureka:
  client:
    service-url:
      defaultZone: ${BANK_EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

server:
  port: 8090
  forward-headers-strategy: framework