spring:
  application:
    name: front-ui-service
  security:
    oauth2:
      client:
        registration:
          front-ui-service:
            provider: keycloak
            client-id: front-ui-service
            client-secret: ${FRONT_UI_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            authorization-uri: ${BANK_KEYCLOAK_AUTHORIZATION_URI:http://localhost:8180/realms/my-bank-realm/protocol/openid-connect/auth}
            token-uri: ${BANK_KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/my-bank-realm/protocol/openid-connect/token}
            jwk-set-uri: ${BANK_KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/my-bank-realm/protocol/openid-connect/certs}
            user-info-uri: ${BANK_KEYCLOAK_USER_INFO_URI:http://localhost:8180/realms/my-bank-realm/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username

api:
  gateway:
    base-url: ${API_GATEWAY_URL:http://localhost:8080}
  security:
    logout:
      end-session-uri: ${BANK_KEYCLOAK_END_SESSION_URI:http://localhost:8180/realms/my-bank-realm/protocol/openid-connect/logout}

bank:
  services:
    front-ui-service:
      http-client:
        circuit-breaker:
          failure-threshold: ${FRONT_UI_SERVICE_FAILURE_THRESHOLD:3}
          open-duration: ${FRONT_UI_SERVICE_OPEN_DURATION:3}
        retry:
          max-attempts: ${FRONT_UI_SERVICE_MAX_ATTEMPTS:5}
          backoff: ${FRONT_UI_SERVICE_BACKOFF:100ms}

server:
  port: 8085
  forward-headers-strategy: framework