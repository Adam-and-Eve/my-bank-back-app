spring:
  application:
    name: exchange-generator-service
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          exchange-generator-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: exchange-generator-service
            client-secret: ${BANK_SERVICES_EXCHANGE_GENERATOR_SERVICE_CLIENT_SECRET:}
        provider:
          keycloak:
            token-uri: ${BANK_KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/token}

bank:
  http-client:
    connect-timeout: ${BANK_HTTP_CLIENT_CONNECT_TIMEOUT:2s}
    read-timeout: ${BANK_HTTP_CLIENT_READ_TIMEOUT:5s}
    circuit-breaker:
      failure-threshold: ${BANK_HTTP_CLIENT_CIRCUIT_BREAKER_FAILURE_THRESHOLD:3}
      open-duration: ${BANK_HTTP_CLIENT_CIRCUIT_BREAKER_OPEN_DURATION:5s}
    retry:
      max-attempts: ${BANK_HTTP_CLIENT_RETRY_MAX_ATTEMPTS:2}
      backoff: ${BANK_HTTP_CLIENT_RETRY_BACKOFF:100ms}
  services:
    blocker-service:
      base-url: ${BANK_SERVICES_BLOCKER_SERVICE_BASE_URL:http://blocker-service}
    exchange-service:
      base-url: ${BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL:http://exchange-service}
    exchange-generator-service:
      fixed-delay-ms: ${BANK_SERVICES_EXCHANGE_GENERATOR_SERVICES_FIXED_DELAY_MS:1000}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8097}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      namespace: ${MANAGEMENT_METRICS_TAGS_NAMESPACE:dev}
  tracing:
    propagation:
      type: ${MANAGEMENT_TRACING_PROPAGATION_TYPE:W3C}
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
      export:
        enabled: ${MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED:true}

server:
  port: ${SERVER_PORT:8087}