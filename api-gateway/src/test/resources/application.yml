spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: block-account-internal-api
              uri: no://op
              predicates:
                - Path=/api/account/internal/**
              filters:
                - SetStatus=404
            - id: account-service
              uri: http://account-service:8081
              predicates:
                - Path=/api/account/**
              filters:
                - JwtTokenRelay
            - id: cash-service
              uri: http://cash-service:8082
              predicates:
                - Path=/api/cash/**
              filters:
                - JwtTokenRelay
            - id: transfer-service
              uri: http://transfer-service:8083
              predicates:
                - Path=/api/transfer
              filters:
                - JwtTokenRelay
            - id: exchange-service
              uri: http://exchange-service:8086
              predicates:
                - Path=/api/exchange/**
              filters:
                - JwtTokenRelay
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/my-bank-realm
          jwk-set-uri: http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/certs