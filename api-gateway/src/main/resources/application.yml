spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: block-account-internal-api
              uri: no://op
              predicates:
                - Path=/api/account/internal/**
              filters:
                - SetStatus=404
            - id: account-service
              uri:  ${BANK_ACCOUNT_SERVICE_BASE_URL:http://account-service:8081}
              predicates:
                - Path=/api/account/**
              filters:
                - JwtTokenRelay
            - id: cash-service
              uri: ${BANK_CASH_SERVICE_BASE_URL:http://cash-service:8082}
              predicates:
                - Path=/api/cash/**
              filters:
                - JwtTokenRelay
            - id: transfer-service
              uri: ${BANK_TRANSFER_SERVICE_BASE_URL:http://transfer-service:8083}
              predicates:
                - Path=/api/transfer
              filters:
                - JwtTokenRelay
            - id: exchange-service
              uri: ${BANK_EXCHANGE_SERVICE_BASE_URL:http://exchange-service:8086}
              predicates:
                - Path=/api/exchange/**
              filters:
                - JwtTokenRelay
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BANK_KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/my-bank-realm}
          jwk-set-uri: ${BANK_KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080