spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: block-account-internal-api
              uri: no://op
              predicates:
                - Path=/api/account/internal/**
              filters:
                - SetStatus=404
            - id: account-service
              uri:  ${BANK_SERVICES_ACCOUNT_SERVICE_BASE_URL:http://account-service:8081}
              predicates:
                - Path=/api/account/**
              filters:
                - JwtTokenRelay
            - id: cash-service
              uri: ${BANK_SERVICES_CASH_SERVICE_BASE_URL:http://cash-service:8082}
              predicates:
                - Path=/api/cash/**
              filters:
                - JwtTokenRelay
            - id: transfer-service
              uri: ${BANK_SERVICES_TRANSFER_SERVICE_BASE_URL:http://transfer-service:8083}
              predicates:
                - Path=/api/transfer
              filters:
                - JwtTokenRelay
            - id: exchange-service
              uri: ${BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL:http://exchange-service:8086}
              predicates:
                - Path=/api/exchange/**
              filters:
                - JwtTokenRelay
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BANK_KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/my-bank-realm}
          jwk-set-uri: ${BANK_KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/certs}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8090}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      namespace: ${MANAGEMENT_METRICS_TAGS_NAMESPACE:dev}
  tracing:
    propagation:
      type: ${MANAGEMENT_TRACING_PROPAGATION_TYPE:W3C}
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
      export:
        enabled: ${MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}