spring:
  security:
    oauth2:
      client:
        registration:
          transfer-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: transfer-service
            client-secret: test-secret
        provider:
          keycloak:
            token-uri: http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/token
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/my-bank-realm
          jwk-set-uri: http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/certs

bank:
  services:
    account-service:
      base-url: http://account-service:8081
    blocker-service:
      base-url: http://blocker-service:8088
    exchange-service:
      base-url: http://exchange-service:8086
    notification-service:
      base-url: http://notification-service:8084