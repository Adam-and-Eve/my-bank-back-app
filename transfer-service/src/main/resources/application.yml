spring:
  application:
    name: transfer-service
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          transfer-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: transfer-service
            client-secret: ${BANK_SERVICES_TRANSFER_SERVICE_CLIENT_SECRET:}
        provider:
          keycloak:
            token-uri: ${BANK_KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/token}
      resourceserver:
        jwt:
          issuer-uri: ${BANK_KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/my-bank-realm}
          jwk-set-uri: ${BANK_KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/certs}

bank:
  services:
    account-service:
      base-url: ${BANK_SERVICES_ACCOUNT_SERVICE_BASE_URL:http://account-service:8081}
    blocker-service:
      base-url: ${BANK_SERVICES_BLOCKER_SERVICE_BASE_URL:http://blocker-service:8088}
    exchange-service:
      base-url: ${BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL:http://exchange-service:8086}
    notification-service:
      base-url: ${BANK_SERVICES_NOTIFICATION_SERVICE_BASE_URL:http://notification-service:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8083