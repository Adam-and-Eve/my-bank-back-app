spring:
  datasource:
    url: jdbc:h2:mem:account-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    admin:
      fail-fast: false
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 2147483647
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 120000
        "[request.timeout.ms]": 30000
        "[max.in.flight.requests.per.connection]": 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/my-bank-realm
          jwk-set-uri: http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/certs

bank:
  balance:
    retry:
      max-attempts: 3
      backoff-ms: 0
  kafka:
    notification-dlt-topic: bank.notification.dlt
    notification-dlt-partitions: 3
    notification-dlt-retention-ms: 604800000
    notification-partitions: 3
    notification-replication-factor: 1
    notification-topic: bank.notification