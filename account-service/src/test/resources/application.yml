spring:
  datasource:
    url: jdbc:h2:mem:account-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/my-bank-realm
          jwk-set-uri: http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/certs