spring:
  cloud:
    config:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          cash-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: cash-service
            client-secret: test-secret
        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/my-bank-realm/protocol/openid-connect/token
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/my-bank-realm
          jwk-set-uri: http://localhost:8180/realms/my-bank-realm/protocol/openid-connect/certs

bank:
  services:
    account-service:
      base-url: http://account-service
    notification-service:
      base-url: http://notification-service
    blocker-service:
      base-url: http://blocker-service

eureka:
  client:
    enabled: false