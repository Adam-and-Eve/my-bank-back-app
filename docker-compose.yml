x-app-health: &app-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-platform-health: &platform-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

x-config-client-env: &config-client-env
  BANK_CONFIG_IMPORT: configserver:http://config-server:8888
  BANK_EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/

x-resource-server-env: &resource-server-env
  BANK_KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/my-bank-realm
  BANK_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/my-bank-realm/protocol/openid-connect/certs


services:
  postgres:
    image: postgres:18
    container_name: postgres
    profiles:
      - infra
    environment:
      POSTGRES_DB: bank
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d bank" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [ bank-network ]

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: keycloak
    profiles:
      - infra
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-__KEYCLOAK_ADMIN_USERNAME__}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-__KEYCLOAK_ADMIN_PASSWORD__}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_PORT: 8080
    ports:
      - "8180:8080"
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8080'" ]
    volumes:
      - ./keycloak/realms/bank-realm.json:/opt/keycloak/data/import/bank-realm-realm.json:ro
    networks: [ bank-network ]

  config-server:
    build:
      context: ./config-server
    image: my-bank-config-server:local
    container_name: config-server
    profiles:
      - infra
    ports:
      - "8888:8888"
    healthcheck:
      <<: *platform-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8888'" ]
    networks: [ bank-network ]

  discovery-server:
    build:
      context: ./discovery-server
    image: my-bank-discovery-server:local
    container_name: discovery-server
    profiles:
      - infra
    environment:
      <<: *config-client-env
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      <<: *platform-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8761'" ]
    networks: [ bank-network ]

volumes:
  postgres-data:

networks:
  bank-network: