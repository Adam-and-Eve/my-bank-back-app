x-app-health: &app-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-keycloak-env: &keycloak-env
  KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
  KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
  KC_HEALTH_ENABLED: "true"
  KC_HOSTNAME: ${KC_HOSTNAME}
  KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT}
  KC_HTTP_PORT: ${KC_HTTP_PORT}

  BANK_PUBLIC_BASE_URL: ${BANK_PUBLIC_BASE_URL}

  BANK_SERVICES_FRONT_UI_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_FRONT_UI_SERVICE_CLIENT_SECRET}
  BANK_SERVICES_ACCOUNT_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_ACCOUNT_SERVICE_CLIENT_SECRET}
  BANK_SERVICES_CASH_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_CASH_SERVICE_CLIENT_SECRET}
  BANK_SERVICES_TRANSFER_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_TRANSFER_SERVICE_CLIENT_SECRET}
  BANK_SERVICES_NOTIFICATION_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_NOTIFICATION_SERVICE_CLIENT_SECRET}
  BANK_SERVICES_EXCHANGE_GENERATOR_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_EXCHANGE_GENERATOR_SERVICE_CLIENT_SECRET}


x-jenkins-env: &jenkins-env
  JENKINS_ADMIN_ID: admin
  JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}

x-kafka-producer-env: &kafka-producer-env
  SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
  BANK_KAFKA_NOTIFICATION_TOPIC: ${BANK_KAFKA_NOTIFICATION_TOPIC}

x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID}
  KAFKA_NODE_ID: ${KAFKA_NODE_ID}
  KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
  KAFKA_LISTENERS: ${KAFKA_LISTENERS}
  KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
  KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
  KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
  KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS}
  KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS}
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE}
  KAFKA_LOG_DIRS: ${KAFKA_LOG_DIRS}

x-notification-service-env: &notification-service-env
  <<: *kafka-producer-env

  BANK_KEYCLOAK_ISSUER_URI: ${BANK_KEYCLOAK_ISSUER_URI}
  BANK_KEYCLOAK_JWK_SET_URI: ${BANK_KEYCLOAK_JWK_SET_URI}
  BANK_SERVICES_NOTIFICATION_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_NOTIFICATION_SERVICE_CLIENT_SECRET}

  LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}

  SERVER_PORT: "8084"

x-transfer-service-env: &transfer-service-env
  <<: *kafka-producer-env

  BANK_KEYCLOAK_ISSUER_URI: ${BANK_KEYCLOAK_ISSUER_URI}
  BANK_KEYCLOAK_JWK_SET_URI: ${BANK_KEYCLOAK_JWK_SET_URI}
  BANK_KEYCLOAK_TOKEN_URI: ${BANK_KEYCLOAK_TOKEN_URI}

  BANK_SERVICES_TRANSFER_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_TRANSFER_SERVICE_CLIENT_SECRET}

  BANK_SERVICES_ACCOUNT_SERVICE_BASE_URL: ${BANK_SERVICES_ACCOUNT_SERVICE_BASE_URL}
  BANK_SERVICES_BLOCKER_SERVICE_BASE_URL: ${BANK_SERVICES_BLOCKER_SERVICE_BASE_URL}
  BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL: ${BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL}

  LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}

  SERVER_PORT: "8083"


x-cash-service-env: &cash-service-env
  <<: *kafka-producer-env

  BANK_KEYCLOAK_ISSUER_URI: ${BANK_KEYCLOAK_ISSUER_URI}
  BANK_KEYCLOAK_JWK_SET_URI: ${BANK_KEYCLOAK_JWK_SET_URI}
  BANK_KEYCLOAK_TOKEN_URI: ${BANK_KEYCLOAK_TOKEN_URI}

  BANK_SERVICES_CASH_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_CASH_SERVICE_CLIENT_SECRET}

  BANK_SERVICES_ACCOUNT_SERVICE_BASE_URL: ${BANK_SERVICES_ACCOUNT_SERVICE_BASE_URL}
  BANK_SERVICES_BLOCKER_SERVICE_BASE_URL: ${BANK_SERVICES_BLOCKER_SERVICE_BASE_URL}
  BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL: ${BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL}

  LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}

  SERVER_PORT: "8082"


x-account-service-env: &account-service-env
  <<: *kafka-producer-env

  BANK_KEYCLOAK_ISSUER_URI: ${BANK_KEYCLOAK_ISSUER_URI}
  BANK_KEYCLOAK_JWK_SET_URI: ${BANK_KEYCLOAK_JWK_SET_URI}

  BANK_DATASOURCE_URL: jdbc:postgresql://postgres:5432/my-bank
  BANK_DATASOURCE_USERNAME: postgres

  BANK_SERVICES_ACCOUNT_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_ACCOUNT_SERVICE_CLIENT_SECRET}

  LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}

  SERVER_PORT: "8081"


x-front-ui-service-env: &front-ui-service-env
  BANK_SERVICES_FRONT_UI_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_FRONT_UI_SERVICE_CLIENT_SECRET}

  BANK_KEYCLOAK_AUTHORIZATION_URI: ${BANK_KEYCLOAK_AUTHORIZATION_URI}
  BANK_KEYCLOAK_TOKEN_URI: ${BANK_KEYCLOAK_TOKEN_URI}
  BANK_KEYCLOAK_JWK_SET_URI: ${BANK_KEYCLOAK_JWK_SET_URI}
  BANK_KEYCLOAK_USER_INFO_URI: ${BANK_KEYCLOAK_USER_INFO_URI}
  BANK_KEYCLOAK_END_SESSION_URI: ${BANK_KEYCLOAK_END_SESSION_URI}

  BANK_PUBLIC_BASE_URL: ${BANK_PUBLIC_BASE_URL}
  BANK_KEYCLOAK_REDIRECT_URI: ${BANK_KEYCLOAK_REDIRECT_URI}

  BANK_SERVICES_ACCOUNT_SERVICE_BASE_URL: ${BANK_SERVICES_ACCOUNT_SERVICE_BASE_URL}
  BANK_SERVICES_CASH_SERVICE_BASE_URL: ${BANK_SERVICES_CASH_SERVICE_BASE_URL}
  BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL: ${BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL}
  BANK_SERVICES_TRANSFER_SERVICE_BASE_URL: ${BANK_SERVICES_TRANSFER_SERVICE_BASE_URL}

  LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}

  SERVER_PORT: "8085"


x-exchange-service-env: &exchange-service-env
  BANK_KEYCLOAK_ISSUER_URI: ${BANK_KEYCLOAK_ISSUER_URI}
  BANK_KEYCLOAK_JWK_SET_URI: ${BANK_KEYCLOAK_JWK_SET_URI}

  LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}

  SERVER_PORT: "8086"


x-exchange-generator-service-env: &exchange-generator-service-env
  BANK_KEYCLOAK_ISSUER_URI: ${BANK_KEYCLOAK_ISSUER_URI}
  BANK_KEYCLOAK_JWK_SET_URI: ${BANK_KEYCLOAK_JWK_SET_URI}
  BANK_KEYCLOAK_TOKEN_URI: ${BANK_KEYCLOAK_TOKEN_URI}

  BANK_SERVICES_EXCHANGE_GENERATOR_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_EXCHANGE_GENERATOR_SERVICE_CLIENT_SECRET}

  BANK_SERVICES_BLOCKER_SERVICE_BASE_URL: ${BANK_SERVICES_BLOCKER_SERVICE_BASE_URL}
  BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL: ${BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL}
  BANK_SERVICES_EXCHANGE_GENERATOR_SERVICES_FIXED_DELAY_MS: ${BANK_SERVICES_EXCHANGE_GENERATOR_SERVICES_FIXED_DELAY_MS}

  LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}

  SERVER_PORT: "8087"


x-blocker-service-env: &blocker-service-env
  BANK_KEYCLOAK_ISSUER_URI: ${BANK_KEYCLOAK_ISSUER_URI}
  BANK_KEYCLOAK_JWK_SET_URI: ${BANK_KEYCLOAK_JWK_SET_URI}

  BANK_SERVICES_BLOCKER_SERVICE_MAX_AMOUNT: ${BANK_SERVICES_BLOCKER_SERVICE_MAX_AMOUNT}

  LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}

  SERVER_PORT: "8088"

services:
  postgres:
    image: postgres:18
    container_name: postgres
    profiles:
      - infra
      - app
      - deploy
    environment:
      POSTGRES_DB: my-bank
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d my-bank" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - bank-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: keycloak
    profiles:
      - infra
      - app
      - deploy
    command: [ "start-dev", "--import-realm" ]
    environment:
      <<: *keycloak-env
    ports:
      - "8180:8080"
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8080'" ]
    volumes:
      - ${BANK_KEYCLOAK_REALM_DIRECTORY}:/opt/keycloak/data/import:ro
    networks: [ bank-network ]

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    restart: unless-stopped
    profiles:
      - infra
      - app
      - deploy
    environment:
      <<: *kafka-env
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [ bank-network ]


  notification-service:
    build:
      context: ./notification-service
    image: my-bank-notification-service:${IMAGE_TAG:-local}
    container_name: notification-service
    restart: unless-stopped
    profiles:
      - app
      - deploy
    environment:
      <<: *notification-service-env
    depends_on:
      kafka:
        condition: service_started
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8084'" ]
    networks: [ bank-network ]

  exchange-service:
    build:
      context: ./exchange-service
    image: my-bank-exchange-service:${IMAGE_TAG:-local}
    container_name: exchange-service
    profiles:
      - app
      - deploy
    environment:
      <<: *exchange-service-env
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8086'" ]
    networks: [ bank-network ]

  exchange-generator-service:
    build:
      context: ./exchange-generator-service
    image: my-bank-exchange-generator-service:${IMAGE_TAG:-local}
    container_name: exchange-generator-service
    profiles:
      - app
      - deploy
    environment:
      <<: *exchange-generator-service-env
    depends_on:
      keycloak:
        condition: service_healthy
      exchange-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8087'" ]
    networks: [ bank-network ]

  blocker-service:
    build:
      context: ./blocker-service
    image: my-bank-blocker-service:${IMAGE_TAG:-local}
    container_name: blocker-service
    profiles:
      - app
      - deploy
    environment:
      <<: *blocker-service-env
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8088'" ]
    networks: [ bank-network ]

  cash-service:
    build:
      context: ./cash-service
    image: my-bank-cash-service:${IMAGE_TAG:-local}
    container_name: cash-service
    restart: unless-stopped
    profiles:
      - app
      - deploy
    environment:
      <<: *cash-service-env
    depends_on:
      kafka:
        condition: service_started
      account-service:
        condition: service_healthy
      blocker-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8082'" ]
    networks: [ bank-network ]

  transfer-service:
    build:
      context: ./transfer-service
    image: my-bank-transfer-service:${IMAGE_TAG:-local}
    container_name: transfer-service
    restart: unless-stopped
    profiles:
      - app
      - deploy
    environment:
      <<: *transfer-service-env
    depends_on:
      kafka:
        condition: service_started
      account-service:
        condition: service_healthy
      exchange-generator-service:
        condition: service_healthy
      exchange-service:
        condition: service_healthy
      blocker-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8083'" ]
    networks: [ bank-network ]

  account-service:
    build:
      context: ./account-service
    image: my-bank-account-service:${IMAGE_TAG:-local}
    container_name: account-service
    restart: unless-stopped
    profiles:
      - app
      - deploy
    environment:
      <<: *account-service-env
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8081'" ]
    networks: [ bank-network ]

  front-ui-service:
    build:
      context: ./front-ui-service
    image: my-bank-front-ui-service:${IMAGE_TAG:-local}
    container_name: front-ui-service
    profiles:
      - app
      - deploy
    environment:
      <<: *front-ui-service-env
    ports:
      - "8085:8085"
    depends_on:
      keycloak:
        condition: service_healthy
      account-service:
        condition: service_healthy
      cash-service:
        condition: service_healthy
      transfer-service:
        condition: service_healthy
      exchange-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8085'" ]
    networks: [ bank-network ]

  nginx:
    image: nginx:alpine
    container_name: nginx
    profiles:
      - deploy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      front-ui-service:
        condition: service_healthy
    networks: [ bank-network ]

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: my-bank-jenkins:${IMAGE_TAG:-local}
    container_name: jenkins

    profiles:
      - deploy
      - ci

    environment:
      <<: *jenkins-env

    ports:
      - "8090:8080"
      - "50000:50000"

    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - bank-network

volumes:
  postgres-data:
  kafka-data:
  jenkins-data:

networks:
  bank-network:
    name: bank-network