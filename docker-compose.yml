  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s


x-platform-health: &platform-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s


x-keycloak-env: &keycloak-env
  KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
  KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
  KC_HEALTH_ENABLED: "true"
  KC_HOSTNAME: http://localhost:8180
  KC_HTTP_PORT: 8080

  BANK_PUBLIC_BASE_URL: ${BANK_PUBLIC_BASE_URL}

  BANK_SERVICES_FRONT_UI_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_FRONT_UI_SERVICE_CLIENT_SECRET}
  BANK_SERVICES_ACCOUNT_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_ACCOUNT_SERVICE_CLIENT_SECRET}
  BANK_SERVICES_CASH_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_CASH_SERVICE_CLIENT_SECRET}
