  BANK_PUBLIC_BASE_URL: ${BANK_PUBLIC_BASE_URL}
  BANK_SERVICES_ACCOUNT_SERVICE_BASE_URL: ${BANK_SERVICES_ACCOUNT_SERVICE_BASE_URL}
  BANK_SERVICES_CASH_SERVICE_BASE_URL: ${BANK_SERVICES_CASH_SERVICE_BASE_URL}
  BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL: ${BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL}
  BANK_SERVICES_TRANSFER_SERVICE_BASE_URL: ${BANK_SERVICES_TRANSFER_SERVICE_BASE_URL}

  SERVER_PORT: "8085"


x-exchange-service-env: &exchange-service-env
  BANK_KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/my-bank-realm
  BANK_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/my-bank-realm/protocol/openid-connect/certs

  SERVER_PORT: "8086"


x-exchange-generator-service-env: &exchange-generator-service-env
  BANK_KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/my-bank-realm
  BANK_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/my-bank-realm/protocol/openid-connect/certs
  BANK_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/my-bank-realm/protocol/openid-connect/token

  BANK_SERVICES_EXCHANGE_GENERATOR_SERVICE_CLIENT_SECRET: ${BANK_SERVICES_EXCHANGE_GENERATOR_SERVICE_CLIENT_SECRET}

  BANK_SERVICES_BLOCKER_SERVICE_BASE_URL: ${BANK_SERVICES_BLOCKER_SERVICE_BASE_URL}
  BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL: ${BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL}
  BANK_SERVICES_EXCHANGE_GENERATOR_SERVICES_FIXED_DELAY_MS: ${BANK_SERVICES_EXCHANGE_GENERATOR_SERVICES_FIXED_DELAY_MS}
  BANK_SERVICES_NOTIFICATION_SERVICE_BASE_URL: ${BANK_SERVICES_NOTIFICATION_SERVICE_BASE_URL}

  SERVER_PORT: "8087"


x-blocker-service-env: &blocker-service-env
  BANK_KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/my-bank-realm
  BANK_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/my-bank-realm/protocol/openid-connect/certs

  BANK_SERVICES_BLOCKER_SERVICE_MAX_AMOUNT: ${BANK_SERVICES_BLOCKER_SERVICE_MAX_AMOUNT}

  SERVER_PORT: "8088"

x-jenkins-env: &jenkins-env:
  JENKINS_ADMIN_ID: admin
  JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}


services:
  postgres:
    image: postgres:18
    container_name: postgres
    profiles:
      - infra
      - app
      - deploy
    environment:
      POSTGRES_DB: my-bank
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d my-bank" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - bank-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: keycloak
    profiles:
      - infra
      - app
      - deploy
    command: [ "start-dev", "--import-realm" ]
    environment:
      <<: *keycloak-env
    ports:
      - "8180:8080"
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8080'" ]
    volumes:
      - ${BANK_KEYCLOAK_REALM_DIRECTORY}:/opt/keycloak/data/import:ro
    networks: [ bank-network ]

  notification-service:
    build:
      context: ./notification-service
    image: my-bank-notification-service:${IMAGE_TAG:-local}
    container_name: notification-service
    profiles:
      - app
      - deploy
    environment:
      <<: *notification-service-env
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8084'" ]
    networks: [ bank-network ]

  exchange-service:
    build:
      context: ./exchange-service
    image: my-bank-exchange-service:${IMAGE_TAG:-local}
    container_name: exchange-service
    profiles:
      - app
      - deploy
    environment:
      <<: *exchange-service-env
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8086'" ]
    networks: [ bank-network ]

  exchange-generator-service:
    build:
      context: ./exchange-generator-service
    image: my-bank-exchange-generator-service:${IMAGE_TAG:-local}
    container_name: exchange-generator-service
    profiles:
      - app
      - deploy
    environment:
      <<: *exchange-generator-service-env
    depends_on:
      exchange-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8087'" ]
    networks: [ bank-network ]

  blocker-service:
    build:
      context: ./blocker-service
    image: my-bank-blocker-service:${IMAGE_TAG:-local}
    container_name: blocker-service
    profiles:
      - app
      - deploy
    environment:
      <<: *blocker-service-env
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8088'" ]
    networks: [ bank-network ]

  cash-service:
    build:
      context: ./cash-service
    image: my-bank-cash-service:${IMAGE_TAG:-local}
    container_name: cash-service
    profiles:
      - app
      - deploy
    environment:
      <<: *cash-service-env
    depends_on:
      notification-service:
        condition: service_healthy
      blocker-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8082'" ]
    networks: [ bank-network ]

  transfer-service:
    build:
      context: ./transfer-service
    image: my-bank-transfer-service:${IMAGE_TAG:-local}
    container_name: transfer-service
    profiles:
      - app
      - deploy
    environment:
      <<: *transfer-service-env
    depends_on:
      notification-service:
        condition: service_healthy
      exchange-generator-service:
        condition: service_healthy
      blocker-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8083'" ]
    networks: [ bank-network ]

  account-service:
    build:
      context: ./account-service
    image: my-bank-account-service:${IMAGE_TAG:-local}
    container_name: account-service
    profiles:
      - app
      - deploy
    environment:
      <<: *account-service-env
    depends_on:
      cash-service:
        condition: service_healthy
      transfer-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8081'" ]
    networks: [ bank-network ]

  front-ui-service:
    build:
      context: ./front-ui-service
    image: my-bank-front-ui-service:${IMAGE_TAG:-local}
    container_name: front-ui-service
    profiles:
      - app
      - deploy
    environment:
      <<: *front-ui-service-env
    ports:
      - "8085:8085"
    depends_on:
      account-service:
        condition: service_healthy
      cash-service:
        condition: service_healthy
      transfer-service:
        condition: service_healthy
      exchange-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: [ "CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8085'" ]
    networks: [ bank-network ]

  nginx:
    image: nginx:alpine
    container_name: nginx
    profiles:
      - deploy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      front-ui-service:
        condition: service_healthy
    networks: [ bank-network ]

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: my-bank-jenkins:${IMAGE_TAG:-local}
    container_name: jenkins

    profiles:
      - ci
      - deploy

    environment:
      <<: *jenkins-env

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - bank-network

volumes:
  postgres-data:
  jenkins-data:

networks:
  bank-network:
    name: bank-network