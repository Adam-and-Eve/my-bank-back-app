spring:
  main:
    web-application-type: servlet
  application:
    name: notifications-service
  kafka:
    admin:
      fail-fast: false
    bootstrap-servers: localhost:9092
    consumer:
      group-id: bank-notification
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: ru.yandex.practicum.bank.shared.models.NotificationEventModel
        spring.json.trusted.packages: ru.yandex.practicum.bank.shared
    listener:
      ack-mode: record

bank:
  kafka:
    notification-topic: bank.notification
    notification-dlt-topic: bank.notification.dlt
    notification-partitions: 3
    notification-dlt-partitions: 3
    notification-replication-factor: 1
    notification-dlt-retention-ms: 604800000
  services:
    blocker-service:
      base-url: http://blocker-service:8088
    exchange-service:
      base-url: http://exchange-service:8086

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 0