      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/my-bank-realm
          jwk-set-uri: http://localhost:8180/realms/my-bank-realm/protocol/openid-connect/certs

eureka:
  client:
    enabled: false