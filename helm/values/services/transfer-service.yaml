transfer-service:
  enabled: true

  fullnameOverride: transfer-service

  image:
    repository: my-bank-transfer-service

  service:
    port: 8083

  env:
    BANK_SERVICES_ACCOUNT_SERVICE_BASE_URL: http://account-service:8081
    BANK_SERVICES_BLOCKER_SERVICE_BASE_URL: http://blocker-service:8088
    BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL: http://exchange-service:8086
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SERVER_PORT: "8083"

  secretEnv:
    - name: BANK_SERVICES_TRANSFER_SERVICE_CLIENT_SECRET
      secretName: my-bank-service-credentials
      key: BANK_SERVICES_TRANSFER_SERVICE_CLIENT_SECRET