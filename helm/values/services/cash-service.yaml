cash-service:
  enabled: true

  fullnameOverride: cash-service

  image:
    repository: my-bank-cash-service

  service:
    port: 8082

  env:
    BANK_SERVICES_ACCOUNT_SERVICE_BASE_URL: http://account-service:8081
    BANK_SERVICES_BLOCKER_SERVICE_BASE_URL: http://blocker-service:8088
    BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL: http://exchange-service:8086
    SERVER_PORT: "8082"

  secretEnv:
    - name: BANK_SERVICES_CASH_SERVICE_CLIENT_SECRET
      secretName: my-bank-service-credentials
      key: BANK_SERVICES_CASH_SERVICE_CLIENT_SECRET