blocker-service:
  enabled: true

  fullnameOverride: blocker-service

  image:
    repository: my-bank-blocker-service

  service:
    port: 8088

  management:
    enabled: true
    port: 8098

  probes:
    port: management

  env:
    BANK_SERVICES_BLOCKER_SERVICE_MAX_AMOUNT: "100000.00"
    MANAGEMENT_SERVER_PORT: "8098"
    SERVER_PORT: "8088"