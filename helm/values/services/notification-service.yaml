notification-service:
  enabled: true

  fullnameOverride: notification-service

  image:
    repository: my-bank-notification-service

  service:
    port: 8084

  management:
    enabled: true
    port: 8089

  probes:
    port: management

  test:
    enabled: false

  env:
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SPRING_KAFKA_CONSUMER_GROUP_ID: bank-notification
    MANAGEMENT_SERVER_PORT: "8089"
    SERVER_PORT: "8084"

  secretEnv:
    - name: BANK_SERVICES_NOTIFICATION_SERVICE_CLIENT_SECRET
      secretName: my-bank-service-credentials
      key: BANK_SERVICES_NOTIFICATION_SERVICE_CLIENT_SECRET