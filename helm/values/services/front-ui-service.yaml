front-ui-service:
  enabled: true

  fullnameOverride: front-ui-service

  image:
    repository: my-bank-front-ui-service

  service:
    port: 8085

  env:
    BANK_PUBLIC_BASE_URL: http://localhost:8085
    BANK_SERVICES_ACCOUNT_SERVICE_BASE_URL: http://account-service:8081
    BANK_SERVICES_CASH_SERVICE_BASE_URL: http://cash-service:8082
    BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL: http://exchange-service:8086
    BANK_SERVICES_TRANSFER_SERVICE_BASE_URL: http://transfer-service:8083
    BANK_KEYCLOAK_AUTHORIZATION_URI: http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/auth
    BANK_KEYCLOAK_END_SESSION_URI: http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/logout
    BANK_KEYCLOAK_REDIRECT_URI: http://localhost:8080/login/oauth2/code/{registrationId}
    BANK_KEYCLOAK_USER_INFO_URI: http://keycloak:8080/realms/my-bank-realm/protocol/openid-connect/userinfo
    SERVER_PORT: "8085"

  secretEnv:
    - name: BANK_SERVICES_FRONT_UI_SERVICE_CLIENT_SECRET
      secretName: my-bank-service-credentials
      key: BANK_SERVICES_FRONT_UI_SERVICE_CLIENT_SECRET