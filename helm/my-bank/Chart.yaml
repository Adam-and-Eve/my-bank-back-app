apiVersion: v2
name: my-bank
description: Umbrella chart for the bank application
type: application
version: 0.1.0
appVersion: "0.0.1-SNAPSHOT"

dependencies:
  - name: spring-service
    alias: front-ui-service
    version: 0.1.0
    repository: file://../charts/spring-service
    condition: front-ui-service.enabled

  - name: spring-service
    alias: account-service
    version: 0.1.0
    repository: file://../charts/spring-service
    condition: account-service.enabled

  - name: spring-service
    alias: cash-service
    version: 0.1.0
    repository: file://../charts/spring-service
    condition: cash-service.enabled

  - name: spring-service
    alias: transfer-service
    version: 0.1.0
    repository: file://../charts/spring-service
    condition: transfer-service.enabled

  - name: spring-service
    alias: exchange-service
    version: 0.1.0
    repository: file://../charts/spring-service
    condition: exchange-service.enabled

  - name: spring-service
    alias: exchange-generator-service
    version: 0.1.0
    repository: file://../charts/spring-service
    condition: exchange-generator-service.enabled

  - name: spring-service
    alias: blocker-service
    version: 0.1.0
    repository: file://../charts/spring-service
    condition: blocker-service.enabled

  - name: spring-service
    alias: notification-service
    version: 0.1.0
    repository: file://../charts/spring-service
    condition: notification-service.enabled

  - name: spring-service
    alias: api-gateway
    version: 0.1.0
    repository: file://../charts/spring-service
    condition: api-gateway.enabled

  - name: postgresql
    version: 0.1.0
    repository: file://../charts/postgresql
    condition: postgresql.enabled

  - name: keycloak
    version: 0.1.0
    repository: file://../charts/keycloak
    condition: keycloak.enabled

  - name: kafka
    version: 0.1.0
    repository: file://../charts/kafka
    condition: kafka.enabled

  - name: kube-prometheus-stack
    alias: monitoring
    version: 87.4.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.enabled

  - name: zipkin
    version: 0.1.0
    repository: file://../charts/zipkin
    condition: zipkin.enabled

  - name: elasticsearch
    version: 0.1.0
    repository: file://../charts/elasticsearch
    condition: elasticsearch.enabled

  - name: logstash
    version: 0.1.0
    repository: file://../charts/logstash
    condition: logstash.enabled

  - name: kibana
    version: 0.1.0
    repository: file://../charts/kibana
    condition: kibana.enabled