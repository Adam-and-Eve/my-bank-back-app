{{- $test := .Values.helmTest | default dict -}}
  {{- if ($test.enabled | default true) }}

  {{- $keycloak := .Values.keycloak -}}
  {{- $frontUiService := index .Values "front-ui-service" -}}
  {{- $accountService := index .Values "account-service" -}}
  {{- $cashService := index .Values "cash-service" -}}
  {{- $transferService := index .Values "transfer-service" -}}
  {{- $exchangeService := index .Values "exchange-service" -}}

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "my-bank.fullname" . }}-smoke-test
  labels:
    {{- include "my-bank.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed

spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180

  template:
    metadata:
      labels:
        {{- include "my-bank.labels" . | nindent 8 }}

    spec:
      restartPolicy: Never

      containers:
        - name: smoke-test

          image: "{{ $test.imageRepository | default "curlimages/curl" }}:{{ $test.imageTag | default "8.21.0" }}"
          imagePullPolicy: {{ $test.imagePullPolicy | default "IfNotPresent" }}

          command:
            - sh
            - -ec
            - |

              echo "Starting smoke tests..."


              wait_for_status() {
                url="$1"
                expected="$2"

                attempts=30

                while [ $attempts -gt 0 ]; do

                  actual="$(curl \
                    --silent \
                    --show-error \
                    --output /dev/null \
                    --write-out '%{http_code}' \
                    --connect-timeout 2 \
                    --max-time 5 \
                    "$url" || true)"

                  if [ "$actual" = "$expected" ]; then
                    echo "READY: $url -> $actual"
                    return 0
                  fi

                  echo "WAIT: $url expected=$expected actual=$actual"

                  attempts=$((attempts-1))
                  sleep 5
                done

                echo "FAILED: $url expected=$expected"
                exit 1
              }


              echo "Checking Keycloak..."

              {{- if $keycloak.enabled }}

              wait_for_status \
                "http://{{ default "keycloak" $keycloak.fullnameOverride }}:{{ default 8080 $keycloak.service.port }}/realms/my-bank-realm/.well-known/openid-configuration" \
                "200"

              {{- end }}


              echo "Checking frontend..."

              {{- if $frontUiService.enabled }}

              wait_for_status \
                "http://{{ default "front-ui-service" $frontUiService.fullnameOverride }}:{{ default 8085 $frontUiService.service.port }}/" \
                "302"

              {{- end }}


              echo "Checking account-service..."

              {{- if $accountService.enabled }}

              wait_for_status \
                "http://{{ default "account-service" $accountService.fullnameOverride }}:{{ default 8081 $accountService.service.port }}/api/account/me" \
                "401"

              {{- end }}


              echo "Checking cash-service..."

              {{- if $cashService.enabled }}

              wait_for_status \
                "http://{{ default "cash-service" $cashService.fullnameOverride }}:{{ default 8082 $cashService.service.port }}/api/cash/deposit" \
                "401"

              {{- end }}


              echo "Checking transfer-service..."

              {{- if $transferService.enabled }}

              wait_for_status \
                "http://{{ default "transfer-service" $transferService.fullnameOverride }}:{{ default 8083 $transferService.service.port }}/api/transfer" \
                "401"

              {{- end }}


              echo "Checking exchange-service..."

              {{- if $exchangeService.enabled }}

              wait_for_status \
                "http://{{ default "exchange-service" $exchangeService.fullnameOverride }}:{{ default 8086 $exchangeService.service.port }}/api/exchange/rates" \
                "401"

              {{- end }}


              echo "Smoke tests completed successfully"

  {{- end }}