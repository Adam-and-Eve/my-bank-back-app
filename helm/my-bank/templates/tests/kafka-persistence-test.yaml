{{- $test := .Values.helmTest | default dict -}}
  {{- if ($test.enabled | default true) }}
  {{- $kafka := index .Values "kafka" -}}
  {{- $account := index .Values "account-service" -}}
  {{- $notification := index .Values "notification-service" -}}
  {{- $globalEnv := default dict .Values.global.env -}}
  {{- $accountEnv := mergeOverwrite (deepCopy $globalEnv) (default dict $account.env) -}}
  {{- $notificationEnv := mergeOverwrite (deepCopy $globalEnv) (default dict $notification.env) -}}
  {{- $kafkaName := default "kafka" $kafka.fullnameOverride -}}
  {{- $mainTopic := required "BANK_KAFKA_NOTIFICATION_TOPIC is required" (get $accountEnv "BANK_KAFKA_NOTIFICATION_TOPIC") -}}
  {{- $dltTopic := default "bank.notification.dlt" (get $accountEnv "BANK_KAFKA_NOTIFICATION_DLT_TOPIC") -}}
  {{- $baseConsumerGroup := required "notification-service.env.SPRING_KAFKA_CONSUMER_GROUP_ID is required" (get $notificationEnv "SPRING_KAFKA_CONSUMER_GROUP_ID") -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "my-bank.fullname" . }}-kafka-persistence-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "my-bank.fullname" . }}-kafka-persistence-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "my-bank.fullname" . }}-kafka-persistence-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ include "my-bank.fullname" . }}-kafka-persistence-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "my-bank.fullname" . }}-kafka-persistence-test
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "my-bank.fullname" . }}-kafka-persistence-test
  labels:
    {{- include "my-bank.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "my-bank.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "my-bank.fullname" . }}-kafka-persistence-test
      restartPolicy: Never
      volumes:
        - name: state
          emptyDir: {}
      initContainers:
        - name: capture-kafka-state
          image: "{{ $kafka.image.repository }}:{{ $kafka.image.tag }}"
          imagePullPolicy: {{ $kafka.image.pullPolicy }}
          volumeMounts:
            - name: state
              mountPath: /state
          command:
            - bash
            - -ec
            - |
              bootstrap="{{ $kafkaName }}:{{ $kafka.service.brokerPort }}"
              unique_group="{{ $baseConsumerGroup }}-test-$RANDOM"

              get_partition_offset() {
                /opt/kafka/bin/kafka-get-offsets.sh \
                  --bootstrap-server "$bootstrap" \
                  --topic "{{ $mainTopic }}" \
                  --time -1 2>/dev/null | awk -F: '{sum += $3} END {print sum}'
              }

              initial_offset="$(get_partition_offset)"
              test -z "$initial_offset" && initial_offset=0

              event_id="$(cat /proc/sys/kernel/random/uuid)"
              operation_id="$(cat /proc/sys/kernel/random/uuid)"
              occurred_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              
              event="{\"eventId\":\"$event_id\",\"operationId\":\"$operation_id\",\"source\":\"ACCOUNT\",\"type\":\"ACCOUNT_UPDATED\",\"recipientLogin\":\"helm-persistence-test\",\"message\":\"Helm persistence test\",\"occurredAt\":\"$occurred_at\",\"amount\":null,\"currency\":null}"
              
              printf 'helm-persistence-test|%s\n' "$event" |
                /opt/kafka/bin/kafka-console-producer.sh \
                  --bootstrap-server "$bootstrap" \
                  --topic "{{ $mainTopic }}" \
                  --property parse.key=true \
                  --property key.separator='|'

              current_offset="$initial_offset"
              for attempt in $(seq 1 30); do
                current_offset="$(get_partition_offset)"
                test "$current_offset" -gt "$initial_offset" && break
                sleep 1
              done
              test "$current_offset" -gt "$initial_offset"

              topic_id="$(/opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server "$bootstrap" \
                --describe \
                --topic "{{ $mainTopic }}" |
                sed -n 's/.*TopicId: \([^[:space:]]*\).*/\1/p' |
                head -n 1)"
              test -n "$topic_id"

              printf '%s\n' "$topic_id" > /state/topic-id
              printf '%s\n' "$event_id" > /state/event-id
              printf '%s\n' "$event" > /state/payload
        - name: delete-kafka
          image: {{ required "helmTest.kubectlImage is required" $test.kubectlImage | quote }}
          imagePullPolicy: {{ $test.imagePullPolicy | default "IfNotPresent" }}
          command:
            - kubectl
          args:
            - delete
            - pod
            - "{{ $kafkaName }}-0"
            - --wait=true
            - --timeout=120s
        - name: wait-kafka
          image: {{ required "helmTest.kubectlImage is required" $test.kubectlImage | quote }}
          imagePullPolicy: {{ $test.imagePullPolicy | default "IfNotPresent" }}
          command:
            - kubectl
          args:
            - wait
            - --for=condition=Ready
            - pod/{{ $kafkaName }}-0
            - --timeout=180s
        - name: verify-kafka-pvc
          image: {{ required "helmTest.kubectlImage is required" $test.kubectlImage | quote }}
          imagePullPolicy: {{ $test.imagePullPolicy | default "IfNotPresent" }}
          command:
            - kubectl
          args:
            - wait
            - --for=jsonpath={.status.phase}=Bound
            - pvc/{{ $kafkaName }}-data
            - --timeout=30s
      containers:
        - name: verify-kafka-state
          image: "{{ $kafka.image.repository }}:{{ $kafka.image.tag }}"
          imagePullPolicy: {{ $kafka.image.pullPolicy }}
          volumeMounts:
            - name: state
              mountPath: /state
          command:
            - bash
            - -ec
            - |
              bootstrap="{{ $kafkaName }}:{{ $kafka.service.brokerPort }}"
              target_event_id="$(cat /state/event-id)"
              expected_payload="$(cat /state/payload)"

              after_topic_id="$(/opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server "$bootstrap" \
                --describe \
                --topic "{{ $mainTopic }}" |
                sed -n 's/.*TopicId: \([^[:space:]]*\).*/\1/p' |
                head -n 1)"
              test "$after_topic_id" = "$(cat /state/topic-id)"

              consumed_data="$(/opt/kafka/bin/kafka-console-consumer.sh \
                --bootstrap-server "$bootstrap" \
                --topic "{{ $mainTopic }}" \
                --from-beginning \
                --max-messages 1 \
                --timeout-ms 10000)"
              
              echo "$consumed_data" | grep -q "$target_event_id"
              echo "$consumed_data" | grep -q "$expected_payload"
              
              dlt_count="$(/opt/kafka/bin/kafka-get-offsets.sh \
                --bootstrap-server "$bootstrap" \
                --topic "{{ $dltTopic }}" \
                --time -1 2>/dev/null | awk -F: '{sum += $3} END {print sum}')"
              test -z "$dlt_count" || test "$dlt_count" -eq 0

              if kubectl get deployment {{ include "my-bank.fullname" . }}-notification-service >/dev/null 2>&1; then
                kubectl rollout restart deployment/{{ include "my-bank.fullname" . }}-notification-service
                kubectl rollout status deployment/{{ include "my-bank.fullname" . }}-notification-service --timeout=120s
              fi
  {{- end }}