{{- $test := .Values.helmTest | default dict -}}
  {{- if ($test.enabled | default true) }}
  {{- $kafka := index .Values "kafka" -}}
  {{- $account := index .Values "account-service" -}}
  {{- $notification := index .Values "notification-service" -}}
  {{- $globalEnv := default dict .Values.global.env -}}
  {{- $accountEnv := mergeOverwrite (deepCopy $globalEnv) (default dict $account.env) -}}
  {{- $notificationEnv := mergeOverwrite (deepCopy $globalEnv) (default dict $notification.env) -}}
  {{- $kafkaName := default "kafka" $kafka.fullnameOverride -}}
  {{- $mainTopic := required "BANK_KAFKA_NOTIFICATION_TOPIC is required" (get $accountEnv "BANK_KAFKA_NOTIFICATION_TOPIC") -}}
  {{- $dltTopic := required "BANK_KAFKA_NOTIFICATION_DLT_TOPIC is required" (get $notificationEnv "BANK_KAFKA_NOTIFICATION_DLT_TOPIC") -}}
  {{- $partitions := required "BANK_KAFKA_NOTIFICATION_PARTITIONS is required" (get $accountEnv "BANK_KAFKA_NOTIFICATION_PARTITIONS") -}}
  {{- $dltPartitions := required "BANK_KAFKA_NOTIFICATION_DLT_PARTITIONS is required" (get $notificationEnv "BANK_KAFKA_NOTIFICATION_DLT_PARTITIONS") -}}
  {{- $replicationFactor := required "BANK_KAFKA_NOTIFICATION_REPLICATION_FACTOR is required" (get $accountEnv "BANK_KAFKA_NOTIFICATION_REPLICATION_FACTOR") -}}
  {{- $dltRetentionMs := required "BANK_KAFKA_NOTIFICATION_DLT_RETENTION_MS is required" (get $notificationEnv "BANK_KAFKA_NOTIFICATION_DLT_RETENTION_MS") -}}
  {{- $consumerGroup := required "notification-service.env.SPRING_KAFKA_CONSUMER_GROUP_ID is required" (get $notificationEnv "SPRING_KAFKA_CONSUMER_GROUP_ID") -}}
  {{- if lt (int $dltPartitions) (int $partitions) -}}
  {{- fail "notification-service.env.BANK_KAFKA_NOTIFICATION_DLT_PARTITIONS must be greater than or equal to account-service.env.BANK_KAFKA_NOTIFICATION_PARTITIONS" -}}
  {{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "my-bank.fullname" . }}-kafka-broker-test
  labels:
    {{- include "my-bank.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "my-bank.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: kafka-broker-test
          image: "{{ $kafka.image.repository }}:{{ $kafka.image.tag }}"
          imagePullPolicy: {{ $kafka.image.pullPolicy }}
          command:
            - bash
            - -ec
            - |
              bootstrap="{{ $kafkaName }}:{{ $kafka.service.brokerPort }}"

              /opt/kafka/bin/kafka-broker-api-versions.sh \
                --bootstrap-server "$bootstrap" >/dev/null

              main_description="$(/opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server "$bootstrap" \
                --describe \
                --topic "{{ $mainTopic }}")"
              echo "$main_description" | grep -q "PartitionCount: {{ $partitions }}"
              echo "$main_description" | grep -q "ReplicationFactor: {{ $replicationFactor }}"

              dlt_description="$(/opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server "$bootstrap" \
                --describe \
                --topic "{{ $dltTopic }}")"
              echo "$dlt_description" | grep -q "PartitionCount: {{ $dltPartitions }}"
              echo "$dlt_description" | grep -q "ReplicationFactor: {{ $replicationFactor }}"

              dlt_config="$(/opt/kafka/bin/kafka-configs.sh \
                --bootstrap-server "$bootstrap" \
                --entity-type topics \
                --entity-name "{{ $dltTopic }}" \
                --describe)"
              echo "$dlt_config" | grep -q "retention.ms={{ $dltRetentionMs }}"

              /opt/kafka/bin/kafka-consumer-groups.sh \
                --bootstrap-server "$bootstrap" \
                --describe \
                --group "{{ $consumerGroup }}" >/dev/null
  {{- end }}