{{- if .Values.postgresqlCredentials }}
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  password: {{ .Values.postgresqlCredentials.password | quote }}
  {{- end }}