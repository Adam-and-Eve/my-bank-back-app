groups:
  - name: my-bank.alerts
    rules:
      - alert: MyBankHttp5xxRatioHigh
        expr: |
          (
            sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            clamp_min(sum by (application) (rate(http_server_requests_seconds_count[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: My Bank HTTP 5xx ratio is high
          description: More than 5% of HTTP requests return 5xx for application {{ $labels.application }}.
          runbook_url: README.md#my-bank-http-5xx-ratio-high
      - alert: MyBankHttpP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, application) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: My Bank HTTP p95 latency is high
          description: HTTP p95 latency exceeds one second for application {{ $labels.application }}.
          runbook_url: README.md#my-bank-http-p95-latency-high
      - alert: MyBankWithdrawalFailuresHigh
        expr: sum(increase(my_bank_cash_withdrawal_failures_total[10m])) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: My Bank withdrawal failures are high
          description: More than three withdrawal failures occurred during the last ten minutes.
          runbook_url: README.md#bank-withdrawal-failures-high
      - alert: MyBankTransferFailuresHigh
        expr: sum(increase(my_bank_transfer_failures_total[10m])) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: My Bank transfer failures are high
          description: More than three transfer failures occurred during the last ten minutes.
          runbook_url: README.md#my-bank-transfer-failures-high
      - alert: MyBankNotificationDeliveryFailed
        expr: sum(increase(my_bank_notification_delivery_failures_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: My Bank notification delivery failed
          description: At least one notification reached the dead letter topic during the last five minutes.
          runbook_url: README.md#my-bank-notification-delivery-failed