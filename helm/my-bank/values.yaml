global:
  namespace: my-bank
  imageRegistry: ""
  imageTag: local
  publicBaseUrl: http://localhost:8080
  keycloakInternalUrl: http://keycloak:8080/realms/my-bank-realm
  keycloakPublicUrl: http://localhost:8080/realms/my-bank-realm
  postgresql:
    host: postgresql
    port: 5432
    database: my-bank
    username: postgres
  env:
    SPRING_JACKSON_DEFAULTPROPERTYINCLUSION: non_null

    BANK_PUBLIC_BASE_URL: http://localhost:8080

    BANK_KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/my-bank-realm
    BANK_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/my-bank-realm/protocol/openid-connect/certs
    BANK_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/my-bank-realm/protocol/openid-connect/token

    BANK_KAFKA_NOTIFICATION_DLT_PARTITIONS: "3"
    BANK_KAFKA_NOTIFICATION_DLT_RETENTION_MS: "604800000"
    BANK_KAFKA_NOTIFICATION_DLT_TOPIC: my.bank.notification.dlt
    BANK_KAFKA_NOTIFICATION_PARTITIONS: "3"
    BANK_KAFKA_NOTIFICATION_REPLICATION_FACTOR: "1"
    BANK_KAFKA_NOTIFICATION_TOPIC: my.bank.notification

    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    MANAGEMENT_TRACING_PROPAGATION_TYPE: W3C
    MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED: "true"

helmTest:
  enabled: true
  kubectlImage: registry.k8s.io/kubectl:v1.35.5

gatewayApi:
  enabled: true
  gatewayClassName: nginx
  listener:
    name: http
    port: 80
    hostname: ""

kafka:
  enabled: true
  fullnameOverride: kafka
  persistence:
    size: 2Gi
    storageClass: ""

zipkin:
  enabled: true
  fullnameOverride: zipkin

elasticsearch:
  enabled: true
  fullnameOverride: elasticsearch
  environment: dev

logstash:
  enabled: true
  fullnameOverride: logstash
  config:
    elasticsearchUrl: http://elasticsearch:9200

kibana:
  enabled: true
  fullnameOverride: kibana
  config:
    elasticsearchUrl: http://elasticsearch:9200

monitoring:
  enabled: true
  defaultRules:
    create: false
  prometheusOperator:
    enabled: true
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 24h
      serviceMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector:
        matchNames:
          - dev
      ruleSelector: {}
      ruleNamespaceSelector:
        matchNames:
          - dev
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
  alertmanager:
    enabled: true
    alertmanagerSpec:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
  grafana:
    enabled: true
    fullnameOverride: grafana
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistence:
      enabled: true
      size: 1Gi
    sidecar:
      datasources:
        uid: prometheus
      dashboards:
        enabled: true
        searchNamespace: dev

keycloak:
  enabled: true
  fullnameOverride: keycloak
  extraEnv:
    - name: KC_HOSTNAME
      value: http://localhost:8080
    - name: KC_HOSTNAME_STRICT
      value: "false"
  realmImport:
    frontUiPublicUrl: http://localhost:8080

postgresql:
  enabled: true
  fullnameOverride: postgresql