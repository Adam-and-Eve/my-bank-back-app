spring:
  security:
    oauth2:
      client:
        registration:
          front-ui-service:
            provider: keycloak
            client-id: front-ui-service
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
             - openid
             - profile
             - email
        provider:
          keycloak:
            authorization-uri: http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/auth
            token-uri: http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/token
            jwk-set-uri: http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/certs
            user-info-uri: http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username

bank:
  public-base-url: http://localhost:8080
  services:
    account-service:
      base-url: http://account-service:8081
    cash-service:
      base-url: http://cash-service:8082
    transfer-service:
      base-url: http://transfer-service:8083
    exchange-service:
      base-url: http://exchange-service:8086
  security:
    logout:
      end-session-uri: http://localhost/realms/my-bank-realm/protocol/openid-connect/logout
