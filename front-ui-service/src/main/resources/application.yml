spring:
  application:
    name: front-ui-service
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          front-ui-service:
            provider: keycloak
            client-id: front-ui-service
            client-secret: ${BANK_SERVICES_FRONT_UI_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: ${BANK_KEYCLOAK_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope:
              - openid
              - profile
              - email
        provider:
          keycloak:
            authorization-uri: ${BANK_KEYCLOAK_AUTHORIZATION_URI:http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/auth}
            token-uri: ${BANK_KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/token}
            jwk-set-uri: ${BANK_KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/certs}
            user-info-uri: ${BANK_KEYCLOAK_USER_INFO_URI:http://localhost:8080/realms/my-bank-realm/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username

bank:
  public-base-url: ${BANK_PUBLIC_BASE_URL:http://localhost:8080}
  services:
    account-service:
      base-url: ${BANK_SERVICES_ACCOUNT_SERVICE_BASE_URL:http://account-service:8081}
    cash-service:
      base-url: ${BANK_SERVICES_CASH_SERVICE_BASE_URL:http://cash-service:8082}
    transfer-service:
      base-url: ${BANK_SERVICES_TRANSFER_SERVICE_BASE_URL:http://transfer-service:8083}
    exchange-service:
      base-url: ${BANK_SERVICES_EXCHANGE_SERVICE_BASE_URL:http://exchange-service:8086}
  security:
    logout:
      end-session-uri: ${BANK_KEYCLOAK_END_SESSION_URI:http://localhost/realms/my-bank-realm/protocol/openid-connect/logout}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8085
  tomcat:
    use-relative-redirects: true